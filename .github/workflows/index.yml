---name: Terraform Deploy to AWSon:  push:    branches:      - acg-demopermissions:  id-token: write  contents: readjobs:  terraform:    name: Terraform Workflow    runs-on: ubuntu-latest    steps:      - name: Checkout code        uses: actions/checkout@v4      - name: Configure AWS credentials via OIDC        uses: aws-actions/configure-aws-credentials@v3        with:          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}          aws-region: ${{ secrets.AWS_REGION }}      - name: Setup Terraform        uses: hashicorp/setup-terraform@v3      - name: Terraform Init        run: terraform init      - name: Terraform Validate        run: terraform validate      - name: Terraform Plan        run: terraform plan -out=tfplan      - name: Terraform Apply        run: terraform apply -auto-approve tfplan